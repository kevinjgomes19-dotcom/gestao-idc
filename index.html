<style>
:root{--bg:#0b0b0b;--card:#181818;--tx:#f5f5f5;--mut:#9a9a9a;--ac:#ffc400;--acx:#111;--ok:#4cd07d;--bad:#ff6b5e;--bd:#2c2c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f2;--card:#fff;--tx:#111;--mut:#666;--bd:#ddd;--ok:#12803a;--bad:#c0281c}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#181818;--tx:#f5f5f5;--mut:#9a9a9a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:#000;color:var(--ac);padding:12px 16px;font-weight:800;letter-spacing:.5px;border-bottom:3px solid var(--ac)}
header small{display:block;color:#bbb;font-weight:400;font-size:11px}
main{max-width:900px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:2px solid var(--ac);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding-left:12px;padding-right:12px;background:none;border:0;color:#bbb;padding:12px 4px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k{font-size:12px;color:var(--mut)}.v{font-size:20px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.ac{color:var(--ac)}
input,select,textarea{width:100%;padding:10px;margin:3px 0 8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font-size:16px}
label{font-size:12px;color:var(--mut)}
.b{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px}
.b2{background:none;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:13px}

.sc{overflow-x:auto}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}
.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.bars i{display:inline-block;width:42%;vertical-align:bottom}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const r2=n=>Math.round(n*100)/100;
function addM(iso,k){const[y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();const dd=Math.min(d,last);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}
function cpfOk(c){c=(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if(((s*10)%11)%10!=c[t])return false}return true}
let db=null,andam=[],students=[],expenses=[],cfg={saldoInicial:0},view='painel',sel=null,msg='';
const dbs=()=>db.collection('students'),dbe=()=>db.collection('expenses');

function paidOf(s,n){return r2((s.pays||[]).filter(p=>p.inst===n&&!p.est).reduce((a,p)=>a+p.valor,0))}
function instStatus(s,i){const p=paidOf(s,i.n);if(p>=i.valor-0.005)return'Paga';if(p>0)return i.due<today()?'Parcial/vencida':'Parcial';return i.due<today()?'Vencida':'Pendente'}
function saldoDev(s){if(s.status==='cancelado')return 0;return r2((s.inst||[]).reduce((a,i)=>a+Math.max(0,i.valor-paidOf(s,i.n)),0))}
function recebido(s){return r2((s.pays||[]).filter(p=>!p.est).reduce((a,p)=>a+p.valor,0))}
function allIn(){const o=[];students.forEach(s=>(s.pays||[]).filter(p=>!p.est).forEach(p=>o.push({data:p.data,valor:p.valor,desc:'Aluno: '+s.nome+(p.inst?' (parc. '+p.inst+')':' (matrícula)'),forma:p.forma})));return o}
function saldoAtual(){const t=today();const e=allIn().filter(x=>x.data<=t).reduce((a,x)=>a+x.valor,0);const s=expenses.filter(x=>x.data<=t&&!x.est).reduce((a,x)=>a+x.valor,0);return r2((+cfg.saldoInicial||0)+e-s)}

function render(){
 $('#nav').innerHTML=[['painel','Painel'],['alunos','Alunos'],['caixa','Caixa'],['config','Config']].map(([k,l])=>`<button class="${view.startsWith(k)?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 const a=$('#app');
 if(!db){a.innerHTML='<div class="c">'+(window.__dbFail?'Não foi possível conectar. Recarregue a página.':'Carregando…')+'</div>';return}
 a.innerHTML=(msg?`<div class="c ac">${esc(msg)}</div>`:'')+({painel:vPainel,alunos:vAlunos,aluno:vAluno,form:vForm,caixa:vCaixa,config:vConfig}[view]||vPainel)();msg='';
}
function go(v,id){view=v;sel=id||null;render();scrollTo(0,0)}

function vPainel(){
 const t=today(),mo=t.slice(0,7);
 const ativos=students.filter(s=>s.status==='ativo').length;
 const rec=allIn().filter(x=>x.data.slice(0,7)===mo).reduce((a,x)=>a+x.valor,0);
 const des=expenses.filter(x=>x.data.slice(0,7)===mo&&!x.est).reduce((a,x)=>a+x.valor,0);
 let areceber=0,atr=0,atrV=0;
 students.forEach(s=>{if(s.status==='cancelado')return;(s.inst||[]).forEach(i=>{const f=Math.max(0,r2(i.valor-paidOf(s,i.n)));areceber+=f;if(f>0&&i.due<t){atr++;atrV+=f}})});
 const months=[...Array(6)].map((_,k)=>addM(mo+'-01',k-5).slice(0,7));
 const R=months.map(m=>allIn().filter(x=>x.data.slice(0,7)===m).reduce((a,x)=>a+x.valor,0));
 const D=months.map(m=>expenses.filter(x=>x.data.slice(0,7)===m&&!x.est).reduce((a,x)=>a+x.valor,0));
 const mx=Math.max(1,...R,...D);
 return`<h2>Painel</h2><div class="g">
 <div class="c"><div class="k">Alunos ativos</div><div class="v">${ativos}</div></div>
 <div class="c"><div class="k">Matriculados (total)</div><div class="v">${students.length}</div></div>
 <div class="c"><div class="k">Recebido no mês</div><div class="v ok">${brl(rec)}</div></div>
 <div class="c"><div class="k">Despesas no mês</div><div class="v bad">${brl(des)}</div></div>
 <div class="c"><div class="k">Resultado do mês</div><div class="v ${rec-des>=0?'ok':'bad'}">${brl(rec-des)}</div></div>
 <div class="c"><div class="k">Saldo atual (só o realizado)</div><div class="v ac">${brl(saldoAtual())}</div></div>
 <div class="c"><div class="k">A receber</div><div class="v">${brl(areceber)}</div></div>
 <div class="c"><div class="k">Atrasadas (${atr})</div><div class="v bad">${brl(atrV)}</div></div></div>
 <div class="c"><div class="k">Receitas (amarelo) x despesas — 6 meses</div><div class="bars">${months.map((m,i)=>`<div><i style="height:${R[i]/mx*90}px;background:var(--ac)"></i><i style="height:${D[i]/mx*90}px;background:var(--bad)"></i><br>${m.slice(5)}/${m.slice(2,4)}</div>`).join('')}</div></div>`}

function vAlunos(){

function vForm(){

 return`<h2>${sel?'Editar':'Novo'} aluno</h2><div class="c">

 if(!cpfOk(o.cpf)){alert('CPF inválido.');return}

  const rem=r2(total-vm),base=Math.floor(rem/n*100)/100;
  o.inst=[...Array(n)].map((_,k)=>({n:k+1,due:addM(g('venc1'),k),valor:k<n-1?base:r2(rem-base*(n-1))}));

 }

}

 if(k==='inad'){const r=[];students.forEach(s=>{if(s.status==='cancelado')return;let q=0,v=0;s.inst.forEach(i=>{const f=r2(i.valor-paidOf(s,i.n));if(f>0&&i.due<t){q++;v+=f}});if(q)r.push([s.nome,s.turma,q,brl(v)])});return{t:'Inadimplência',h:['Aluno','Turma','Parcelas vencidas','Valor'],r}}
 if(k==='fluxo'){const a=window.__from||t.slice(0,8)+'01',z=window.__to||t;let e=0,s=0;const r=[...allIn().map(x=>({...x,i:1})),...expenses.filter(x=>!x.est).map(x=>({...x,i:0}))].filter(x=>x.data>=a&&x.data<=z).sort((p,q)=>p.data.localeCompare(q.data)).map(x=>{x.i?e+=x.valor:s+=x.valor;return[dbr(x.data),x.desc,x.i?'Entrada':'Saída',brl(x.valor)]});r.push(['','Total entradas','',brl(e)],['','Total saídas','',brl(s)],['','Resultado','',brl(e-s)]);return{t:'Fluxo de caixa '+dbr(a)+' a '+dbr(z),h:['Data','Descrição','Tipo','Valor'],r}}
 if(k==='freq'){const r=[];courses.forEach(c=>enrolled(c).forEach(s=>{const f=freq(c,s.id);r.push([c.nome,s.nome,f.p,f.f,f.j,f.pc===null?'—':f.pc+'%',f.pc!==null&&f.pc<c.min?'ABAIXO':'ok'])}));return{t:'Frequência',h:['Curso','Aluno','Pres.','Faltas','Justif.','%','Situação'],r}}
 return{t:'Contas a pagar e receber',h:['Tipo','Descrição','Venc.','Valor','Pago','Situação'],r:bills.map(b=>[b.tipo,b.desc,dbr(b.venc),brl(b.valor),brl(bpaid(b)),bst(b)])}}

 <div class="c sc"><b>Gestão Escola IDC — ${esc(d.t)}</b><div class="k">Emitido em ${dbr(today())}</div><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${d.h.map(h=>`<th align="left" style="border-bottom:1px solid var(--bd)">${esc(h)}</th>`).join('')}</tr>${d.r.map(r=>`<tr>${r.map(x=>`<td style="padding:4px 2px;border-bottom:1px solid var(--bd)">${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`}

function vConfig(){return`<h2>Configurações</h2><div class="c"><label>Saldo inicial da escola (R$)</label><input id="c_s" type="number" step="0.01" value="${+cfg.saldoInicial||0}"><label>Nome do diretor (certificados)</label><input id="c_dn" value="${esc(cfg.diretor||'')}"><label>Cargo</label><input id="c_dc" value="${esc(cfg.cargo||'Diretor')}"><button class="b" onclick="saveCfg()">Salvar</button></div><div class="c"><b>Exportar pagamentos</b><br><button class="b" onclick="exportCsv()">Baixar CSV</button></div>

 <h2>Auditoria</h2>${audit.sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,60).map(a=>`<div class="c"><div class="k">${new Date(a.ts).toLocaleString('pt-BR')} · ${esc(a.user)}</div>${esc(a.acao)}</div>`).join('')||'<div class="k">Sem registros.</div>'}`:''}`}

(async()=>{
 render();
 try{db=await claude.use('db');const U=await claude.use('user');if(U){me.id=String(await U.id());try{me.name=(await U.me()).name||''}catch(e){}me.owner=!!U.isOwner()}}catch(e){db=null}
 if(!db){window.__dbFail=1;render();return}
 if(me.owner)perfil='dir';
 const err=e=>{msg='Erro de acesso: '+(e&&e.code);render()};
 const on=(c,f)=>db.collection(c).onSnapshot(sn=>{f(sn.docs.map(d=>d.data()));derive();render()},err);
 on('students',x=>students=x);on('expenses',x=>expRaw=x);on('courses',x=>courses=x);on('bills',x=>bills=x);on('audit',x=>audit=[...x]);on('turmas',x=>turmas=x);on('professores',x=>profs=x);on('andamento',x=>andam=x);
 on('users',x=>{users=x;if(!me.owner){const m=x.find(u=>u.id===me.id);perfil=m?m.perfil:'pendente'}});
 db.doc('config/main').onSnapshot(d=>{cfg=d.exists?d.data():{saldoInicial:0};render()},err);
})();

<script>
const DIAS={1:'Segunda-feira',2:'Terça-feira',3:'Quarta-feira'};
const CP=['Aluguel','Água','Energia elétrica','Internet e telefone','Salários e pagamentos de colaboradores','Pagamento de professores','Materiais e produtos','Material didático','Marketing e publicidade','Manutenção e reparos','Impostos e taxas','Equipamentos e investimentos','Outras despesas'];
const CR=['Mensalidades e parcelas de cursos','Matrículas','Inscrições','Cursos e treinamentos','Serviços de barbearia','Venda de produtos','Eventos','Outras receitas'];
const catOpts=(l,cur)=>[...l,...(cur&&!l.includes(cur)?[cur]:[])].map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
let eb=null,ex=null;
const turmaLabel=t=>t.id+' · '+t.turno+' '+t.hora;
const cidOf=s=>s.cursoId||(courses.find(x=>x.nome===s.curso)||{}).id||'';
function turmaOpts(cid,cur){if(!cid)return'<option value="">Escolha o curso primeiro</option>';const l=turmas.filter(t=>t.cursoId===cid&&t.status!=='cancelada');if(!l.length)return'<option value="">Nenhuma turma disponível para este curso</option>';return'<option value="">Selecione</option>'+l.map(t=>`<option value="${t.id}" ${cur===t.id?'selected':''}>${esc(turmaLabel(t)+' · '+DIAS[t.dia])}</option>`).join('')}

const enrolT=c=>enrolled(c).filter(s=>!window.__tm||s.turmaId===window.__tm);

function vTurmas(){const o=(l,f)=>l.map(f).join('');
 return`<h2>Turmas</h2><div class="c"><b>Nova turma</b><label>Curso</label><select id="t_curso">${o(courses.filter(c=>!c.arq),c=>`<option value="${c.id}">${esc(c.nome)}</option>`)}</select><label>Professor</label><select id="t_prof">${o(profs,p=>`<option value="${p.id}">${esc(p.nome)}</option>`)}</select><label>Dia da semana</label><select id="t_dia">${o([1,2,3],d=>`<option value="${d}">${DIAS[d]}</option>`)}</select><label>Turno</label><select id="t_turno">${o(['Manhã','Tarde','Noite'],x=>`<option>${x}</option>`)}</select><label>Horário (24h, HH:MM)</label><input id="t_hora" placeholder="19:00" maxlength="5"><label>Período letivo</label><input id="t_periodo" placeholder="2026.2"><div class="k">O código é gerado automaticamente.</div><button class="b" onclick="createTurma()">Criar turma</button></div>
 <div class="c"><b>Professores</b>${o(profs,p=>`<div class="k">${esc(p.nome)}</div>`)}<input id="pr_n" placeholder="Nome do professor"><button class="b" onclick="addProf()">Adicionar professor</button></div>
 ${o(turmas.slice().sort((a,b)=>a.id.localeCompare(b.id)),t=>{const c=courses.find(x=>x.id===t.cursoId)||{},p=profs.find(x=>x.id===t.profId)||{};return`<div class="c"><div class="row"><b>${t.id}</b><span class="tag">${t.status}</span></div><div class="k">${esc(c.nome)} · ${DIAS[t.dia]} · ${t.turno} ${t.hora} · prof. ${esc(p.nome)} · período ${esc(t.periodo)}</div>${t.status==='cancelada'?'':`<div class="row"><select onchange="saveT('${t.id}','profId',this.value)">${o(profs,x=>`<option value="${x.id}" ${x.id===t.profId?'selected':''}>${esc(x.nome)}</option>`)}</select><input value="${t.hora}" maxlength="5" onchange="saveT('${t.id}','hora',this.value)"><button class="b2" onclick="cancT('${t.id}')">Cancelar</button></div>`}</div>`})}`}
async function createTurma(){const g=k=>$('#t_'+k).value.trim(),d=+g('dia'),h=g('hora');
 if(!g('curso')||!g('prof')||![1,2,3].includes(d)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(h)||!g('periodo')){alert('Preencha curso, professor, dia, horário (HH:MM) e período.');return}
 const yy=String(new Date().getFullYear()).slice(-2);
 for(let k=0;k<5;k++){const n=turmas.filter(t=>t.dia===d&&t.ano===yy).reduce((m,t)=>Math.max(m,t.seq),0)+1+k,id=d+String(n).padStart(2,'0')+'-'+yy;
  try{await db.collection('turmas').doc(id).create({id,cursoId:g('curso'),profId:g('prof'),dia:d,turno:g('turno'),hora:h,periodo:g('periodo'),seq:n,ano:yy,status:'ativa'});log('Turma criada: '+id);msg='Turma '+id+' criada.';render();return}
  catch(e){if(!/duplicate|23505/i.test((e.message||'')+(e.code||''))){alert('Erro: '+(e.message||e.code));return}}}
 alert('Não foi possível gerar o código. Tente de novo.')}
async function addProf(){const n=$('#pr_n').value.trim();if(!n)return;const id=uid();try{await db.collection('professores').doc(id).set({id,nome:n});log('Professor cadastrado: '+n)}catch(e){alert(erroTxt(e))}}
async function saveT(id,k,v){if(k==='hora'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){alert('Horário inválido (HH:MM).');render();return}const t=clone(turmas.find(x=>x.id===id));t[k]=v;try{await db.collection('turmas').doc(id).set(t);log('Turma '+id+' alterada ('+k+')')}catch(e){alert(erroTxt(e))}}

function vContas(){const L=bills.filter(b=>b.tipo===ctab).sort((a,b)=>a.venc.localeCompare(b.venc)),e=eb?bills.find(x=>x.id===eb):null,cats=ctab==='pagar'?CP:CR;
 return`<h2>Contas</h2><div class="row"><button class="${ctab==='pagar'?'b':'b2'}" onclick="ctab='pagar';eb=null;render()">A pagar</button><button class="${ctab==='receber'?'b':'b2'}" onclick="ctab='receber';eb=null;render()">A receber</button></div><div class="c" style="margin-top:10px"><b>${e?'Editar conta':'Nova conta'}</b><label>Descrição</label><input id="b_d" value="${esc(e?e.desc:'')}"><label>Categoria</label><select id="b_c">${catOpts(cats,e?e.cat:'')}</select><label>Valor (R$)</label><input id="b_v" type="number" step="0.01" value="${e?e.valor:''}"><label>Vencimento</label><input id="b_t" type="date" value="${e?e.venc:today()}"><div class="row"><button class="b" onclick="addBill()">${e?'Salvar alteração':'Adicionar'}</button>${e?'<button class="b2" onclick="eb=null;render()">Cancelar edição</button>':''}</div></div>
 ${L.map(b=>{const st=bst(b);return`<div class="c"><div class="row"><b>${esc(b.desc)}</b><span class="tag ${st==='Paga'?'ok':st.includes('encida')?'bad':''}">${st}</span></div><div class="k">${esc(b.cat)} · vence ${dbr(b.venc)} · ${brl(bpaid(b))} de ${brl(b.valor)}</div>${b.est?'':`${st==='Paga'?'':`<div class="row"><input id="bx_${b.id}" type="number" step="0.01" placeholder="valor da baixa"><select id="bf_${b.id}">${FORMAS.map(o=>`<option>${o}</option>`).join('')}</select><button class="b" onclick="baixa('${b.id}')">Baixa</button></div>`}<div class="row"><button class="b2" onclick="editBill('${b.id}')">Editar</button><button class="b2" onclick="delBill('${b.id}')">Excluir</button><button class="b2" onclick="cancBill('${b.id}')">Cancelar</button></div>`}</div>`}).join('')||'<div class="c k">Nada lançado.</div>'}`}
async function addBill(){const v=+$('#b_v').value,d=$('#b_d').value.trim(),t=$('#b_t').value,c=$('#b_c').value;if(!(v>0)||!d||!t){alert('Preencha descrição, valor e vencimento.');return}
 const b0=eb?clone(bills.find(x=>x.id===eb)):null;
 if(bills.some(x=>x.tipo===ctab&&!x.est&&x.id!==eb&&x.desc===d&&x.valor===v&&x.venc===t)){alert('Já existe uma conta igual (mesma descrição, valor e vencimento).');return}
 if(b0&&v<bpaid(b0)-.005){alert('O valor não pode ser menor que o já pago ('+brl(bpaid(b0))+').');return}
 const id=b0?b0.id:uid(),o=b0?{...b0,desc:d,cat:c,valor:v,venc:t}:{id,tipo:ctab,desc:d,cat:c,valor:v,venc:t,pagos:[]};

 const L=[...allIn().map(x=>({...x,tipo:'in'})),...expenses.filter(x=>!x.est&&x.data<=t).map(x=>({data:x.data,valor:x.valor,desc:x.desc+' ['+x.cat+']',forma:x.forma,tipo:'out',id:x.id}))].sort((a,b)=>b.data.localeCompare(a.data));

 <div class="c"><b>${e?'Editar despesa':'Lançar despesa'}</b><label>Descrição</label><input id="x_d" value="${esc(e?e.desc:'')}"><label>Categoria</label><select id="x_c">${catOpts(CP,e?e.cat:'')}</select><label>Valor (R$)</label><input id="x_v" type="number" step="0.01" value="${e?e.valor:''}"><label>Data</label><input id="x_t" type="date" value="${e?e.data:t}"><label>Forma</label><select id="x_f"><option value="">Não informada</option>${[...FORMAS,...(e&&e.forma&&!FORMAS.includes(e.forma)?[e.forma]:[])].map(o=>`<option ${e&&e.forma===o?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="row"><button class="b" onclick="addExp()">Salvar</button>${e?'<button class="b2" onclick="ex=null;render()">Cancelar edição</button>':''}</div></div>
 <h2>Despesas futuras</h2>${fut.map(x=>`<div class="c row"><span>${dbr(x.data)} · ${esc(x.desc)}<br><span class="k">${esc(x.cat)} · ${x.bill?'conta a pagar':'lançamento'}${x.data<t?' · vencida':''}</span></span><b>${brl(x.valor)}</b>${btn(x.id)}</div>`).join('')||'<div class="k">Nenhuma despesa prevista.</div>'}

async function delExp(id){const e=expRaw.find(x=>x.id===id);if(!e||!confirm('Excluir a despesa "'+e.desc+'" ('+brl(e.valor)+')? Os saldos serão recalculados.'))return;try{await dbe().doc(id).delete();log('Despesa excluída: '+e.desc+' '+brl(e.valor))}catch(x){alert(erroTxt(x))}}

const _vch=vChamada;vChamada=function(){const c=courses.find(x=>x.id===sel),l=turmas.filter(t=>t.cursoId===(c||{}).id&&t.status!=='cancelada');if(!l.find(t=>t.id===window.__tm))window.__tm=l[0]?l[0].id:'';
 return _vch().replace('<div class="k">Aula ',(l.length?`<label>Turma</label><select onchange="window.__tm=this.value;render()">${l.map(t=>`<option value="${t.id}" ${t.id===window.__tm?'selected':''}>${esc(turmaLabel(t))}</option>`).join('')}</select>`:'')+'<div class="k">Aula ')};
function freqRel(){const t=turmas.find(x=>x.id===window.__rt)||turmas[0];if(!t)return{t:'Frequência',h:['Aviso'],r:[['Cadastre uma turma primeiro.']]};const c=courses.find(x=>x.id===t.cursoId);
 return{t:'Frequência — turma '+t.id+' ('+(c?c.nome:'')+')',h:['Aluno','Situação','Pres.','Faltas','Justif.','%','Frequência'],r:students.filter(s=>s.turmaId===t.id).map(s=>{const f=c?freq(c,s.id):{p:0,f:0,j:0,pc:null};return[s.nome,s.status,f.p,f.f,f.j,f.pc===null?'—':f.pc+'%',f.pc!==null&&c&&f.pc<c.min?'ABAIXO':'ok']})}}
const _rd=relData;relData=function(){return window.__rel==='freq'?freqRel():_rd()};
const _vr=vRel;vRel=function(){const h=_vr();if(window.__rel!=='freq')return h;const t=window.__rt||(turmas[0]||{}).id;return h.replace('<div class="row"><button class="b" onclick="window.print()">',`<label>Turma</label><select onchange="window.__rt=this.value;render()">${turmas.map(x=>`<option value="${x.id}" ${x.id===t?'selected':''}>${esc(turmaLabel(x))}</option>`).join('')}</select><div class="row"><button class="b" onclick="window.print()">`)};
</script>
<script>
const _r=render;render=function(){try{_r()}catch(e){document.getElementById('app').innerHTML='<div class="c bad"><b>Erro no app:</b><br>'+esc(e.message)+'</div>'}};
addEventListener('error',e=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class="c bad"><b>Erro:</b><br>'+esc(e.message)+'</div>'});
</script><script>
const addD=(d,n)=>new Date(new Date(d).getTime()+n*864e5).toISOString().slice(0,10);
/* ===== Atualização: cursos fixos, turmas, professores, caixa, avaliações ===== */
const tOf=id=>turmas.find(x=>x.id===id);
const cOf=t=>courses.find(x=>x.id===t.cursoId)||{nome:'(curso removido)',mods:[],min:75,just:false,avals:[]};
const manageT=()=>perfil==='dir'||perfil==='ped';
const TURNOS=['Manhã','Tarde','Noite'];
const FORMAS=['Pix','Cartão de crédito','Cartão de débito','Dinheiro','Transferência','Boleto'];
const profsOf=t=>t.profIds&&t.profIds.length?t.profIds:(t.profId?[t.profId]:[]);
const profNames=t=>profsOf(t).map(id=>(profs.find(p=>p.id===id)||{}).nome).filter(Boolean).join(', ')||'—';
const myProf=()=>profs.find(p=>p.userId===me.id);
const visT=t=>perfil!=='prof'||(!!myProf()&&profsOf(t).includes(myProf().id));
const ocupadas=t=>students.filter(s=>s.turmaId===t.id&&s.status==='ativo').length;
window.__tf='ativa';window.__ft=false;window.__fp=false;window.__cd=null;window.__sec={};window.__ob={};window.__cx=false;window.__cxp='mes';
window.__nf={profs:['']};
function erroTxt(e){const m=(e&&(e.message||e.code))||'',c=(e&&e.code)||'';if(/row-level|42501|permission|policy/i.test(m+' '+c))return'Sem permissão para gravar isso. Avise o diretor.';return'Erro ao salvar'+(m?': '+m:'.')}
function copyId(){const t=me.id;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('Código copiado. Envie ao diretor.'),()=>prompt('Copie o código:',t));else prompt('Copie o código:',t)}

/* ---------- Andamento por turma (data, chamada, observação, notas) ---------- */
const A=t=>andam.find(y=>y.id===t.id)||{prog:t.prog||{},att:t.att||{},notas:{}};
const lessonsT=(c,t)=>lessons(c).map(a=>{const p=(A(t).prog||{})[a.id]||{};return{...a,data:p.data||'',status:p.status||'planejada',obs:p.obs||''}});
function freqT(c,t,sid){let p=0,f=0,j=0;const at=A(t).att||{};lessonsT(c,t).forEach(a=>{const r=at[a.id];if(!done(a)||!r||!r[sid])return;const x=r[sid];if(x==='P'||x==='A')p++;else if(x==='F')f++;else j++});const den=p+f+(c.just?j:0);return{p,f,j,pc:den?Math.round(p/den*100):null}}
const notaOf=(t,sid,vid)=>{const n=((A(t).notas||{})[sid]||{})[vid];return typeof n==='number'?n:null};

async function andSet(tid,fn){const t=tOf(tid),cur=andam.find(x=>x.id===tid);const b=cur?clone(cur):{id:tid,prog:clone(t.prog||{}),att:clone(t.att||{})};b.prog=b.prog||{};b.att=b.att||{};b.notas=b.notas||{};fn(b);await db.collection('andamento').doc(tid).set(b);andam=andam.filter(x=>x.id!==tid).concat([clone(b)])}
async function saveLesT(tid,aid,k,v){try{await andSet(tid,b=>{b.prog[aid]={...(b.prog[aid]||{}),[k]:v}});if(k==='status'){const a=lessons(cOf(tOf(tid))).find(x=>x.id===aid)||{};log('Turma '+tid+' · aula '+a.n+': '+v)}}catch(e){alert(erroTxt(e))}}
async function saveObs(tid,aid,v){try{await andSet(tid,b=>{b.prog[aid]={...(b.prog[aid]||{}),obs:v.trim()}});msg='Observação salva.';render()}catch(e){alert(erroTxt(e))}}
async function saveNota(tid,sid,vid,raw){const bid=String(vid).replace(/__r$/,''),t=tOf(tid),av=(cOf(t).avals||[]).find(x=>x.id===bid);if(!av)return;const s=String(raw).trim().replace(',','.');
 if(s!==''){const n=parseFloat(s);if(isNaN(n)||n<0||n>av.max){alert('A nota deve ficar entre 0 e '+av.max+'.');render();return}}
 try{await andSet(tid,b=>{b.notas[sid]=b.notas[sid]||{};if(s==='')delete b.notas[sid][vid];else b.notas[sid][vid]=Math.round(parseFloat(s)*100)/100});render()}catch(e){alert(erroTxt(e))}}
async function saveCham(){const t=tOf(sel),o={};students.filter(s=>s.turmaId===t.id&&s.status==='ativo').forEach(s=>{const v=$('#a_'+s.id).value;if(v)o[s.id]=v});const lid=window.__les;
 try{await andSet(t.id,b=>{b.att[lid]=o;const p=b.prog[lid]||{};if(!p.status||p.status==='planejada')p.status='realizada';b.prog[lid]=p});const a=lessons(cOf(t)).find(x=>x.id===lid)||{};log('Chamada registrada/editada: turma '+t.id+' aula '+a.n);msg='Chamada salva.';go('turma',t.id)}catch(e){alert(erroTxt(e))}}

/* ---------- Alunos: atraso ---------- */
function atraso(s){if(s.status==='cancelado')return null;const t=today();let v=0,q=0,old=null;(s.inst||[]).forEach(i=>{const f=r2(i.valor-paidOf(s,i.n));if(f>0.005&&i.due<t){v+=f;q++;if(!old||i.due<old)old=i.due}});if(!q)return null;return{v:r2(v),q,dias:Math.max(0,Math.floor((new Date(t)-new Date(old))/864e5))}}

function turmaOpts(cid,cur){if(!cid)return'<option value="">Escolha o curso primeiro</option>';const l=turmas.filter(t=>t.cursoId===cid&&((t.status==='ativa'&&(!t.max||ocupadas(t)<t.max))||t.id===cur));if(!l.length)return'<option value="">Nenhuma turma com vaga para este curso</option>';return'<option value="">Selecione</option>'+l.map(t=>`<option value="${t.id}" ${cur===t.id?'selected':''}>${esc(turmaLabel(t)+' · '+DIAS[t.dia]+(t.max?' · '+ocupadas(t)+'/'+t.max:''))}</option>`).join('')}

/* ---------- Cursos ---------- */
vCursos=function(){return`<div class="row"><h2>Cursos</h2><button class="b" onclick="go('cform')">+ Novo</button></div>${courses.filter(c=>!c.arq).map(c=>`<div class="c" onclick="window.__cd=null;go('curso','${c.id}')"><b>${esc(c.nome)}</b><div class="k">${c.mods.length} módulos · ${lessons(c).length} aulas · ${c.carga}h</div><div class="k">${enrolled(c).length} alunos ativos</div></div>`).join('')||'<div class="c k">Nenhum curso.</div>'}`};
vCForm=function(){const f=(k,l,t='text',v='')=>`<label>${l}</label><input id="c_${k}" type="${t}" value="${v}">`;return`<h2>Novo curso</h2><div class="c">${f('nome','Nome do curso *')}${f('carga','Carga horária total (h)','number')}${f('nmod','Quantidade de módulos *','number','1')}${f('tot','Total de aulas do curso *','number')}<div class="k">As aulas são divididas entre os módulos. Depois você ajusta dentro do curso.</div>${f('min','Frequência mínima (%)','number','75')}<label>Falta justificada</label><select id="c_just"><option value="0">Não entra no cálculo</option><option value="1">Conta como falta</option></select><div class="row"><button class="b2" onclick="go('cursos')">Cancelar</button><button class="b" onclick="saveCurso()">Criar</button></div></div>`};
async function saveCurso(){const g=k=>$('#c_'+k).value.trim(),nm=parseInt(g('nmod')),tot=parseInt(g('tot'));
 if(!g('nome')||!(nm>0)||!(tot>=nm)){alert('Informe nome, módulos e total de aulas (no mínimo uma aula por módulo).');return}
 const id=uid(),b=Math.floor(tot/nm),r=tot%nm;let n=0;
 const mods=[...Array(nm)].map((_,i)=>{const q=b+(i>=nm-r?1:0);return{nome:'Módulo '+(i+1),aulas:[...Array(q)].map(()=>{n++;return{id:'a'+n,n,titulo:'Aula '+n}})}});
 const c={id,nome:g('nome'),carga:+g('carga')||0,min:+g('min')||75,just:g('just')==='1',total:tot,mods,avals:[]};
 try{await db.collection('courses').doc(id).set(c);log('Curso criado: '+c.nome);go('curso',id)}catch(e){alert(erroTxt(e))}}
const cdGet=id=>{if(!window.__cd||window.__cd.id!==id){const c=courses.find(x=>x.id===id);window.__cd=c?clone(c):null;if(window.__cd){if(!window.__cd.avals)window.__cd.avals=[];if(!window.__cd.docs)window.__cd.docs={cert:false,bol:false,notaMin:null}}}return window.__cd};
const cdN=c=>c.mods.reduce((s,m)=>s+m.aulas.length,0);
const cdRenum=c=>{let n=0;c.mods.forEach(m=>m.aulas.forEach(a=>{n++;a.n=n;if(/^Aula \d+$/.test(a.titulo))a.titulo='Aula '+n}))};
vCurso=function(){const c=cdGet(sel);if(!c)return'<div class="c">Curso não encontrado.</div>';
 const n=cdN(c),tot=c.total||n,ok=n===tot,orig=courses.find(x=>x.id===c.id)||{},dirty=JSON.stringify({...orig,avals:orig.avals||[],docs:orig.docs||{cert:false,bol:false,notaMin:null}})!==JSON.stringify(c);
 return`<button class="b2" onclick="window.__cd=null;go('cursos')">← Voltar</button><h2>${esc(c.nome)}</h2><div class="c"><div class="k">${c.carga}h · frequência mínima ${c.min}% · ${c.just?'justificada conta como falta':'justificada fora do cálculo'}</div><label>Total de aulas do curso</label><input type="number" value="${tot}" onchange="cdTotal(this.value)"><div class="${ok?'ok':'bad'}"><b>${n} de ${tot} aulas cadastradas</b>${ok?'':' — ajuste para poder salvar'}</div></div>
 ${c.mods.map((m,mi)=>`<div class="row"><h2>${esc(m.nome)} <button class="b2" onclick="cdRenMod(${mi})">✎</button></h2><button class="b2" onclick="cdAdd(${mi})">+ Aula</button></div>${m.aulas.map((a,ai)=>`<div class="c row"><span>${a.n}. ${esc(a.titulo)}</span><span><button class="b2" onclick="cdRenAula(${mi},${ai})">✎</button> <button class="b2" onclick="cdDel(${mi},${ai})">✕</button></span></div>`).join('')||'<div class="k">Sem aulas.</div>'}`).join('')}
 <div class="row"><h2>Avaliações</h2><button class="b2" onclick="cdAvAdd()">+ Avaliação</button></div>${c.avals.map((v,i)=>`<div class="c"><div class="row"><b>${esc(v.nome)}</b><span><button class="b2" onclick="cdAvRen(${i})">✎</button> <button class="b2" onclick="cdAvDel(${i})">✕</button></span></div><label>Nota máxima</label><input type="number" min="1" step="0.5" value="${v.max}" onchange="cdAvMax(${i},this.value)"><label><input type="checkbox" ${v.rec?'checked':''} onchange="cdAvRec(${i},this.checked)"> Tem recuperação (vale a maior nota)</label></div>`).join('')||'<div class="k">Nenhuma avaliação. As turmas deste curso seguem o que for cadastrado aqui.</div>'}
 <h2>Documentos</h2><div class="c"><label><input type="checkbox" ${c.docs.cert?'checked':''} onchange="cdDoc('cert',this.checked)"> Emitir certificado</label><label><input type="checkbox" ${c.docs.bol?'checked':''} onchange="cdDoc('bol',this.checked)"> Emitir boletim</label><label>Nota final mínima para aprovação</label><input type="number" step="0.5" min="0" value="${c.docs.notaMin===null||c.docs.notaMin===undefined?'':c.docs.notaMin}" onchange="cdDoc('notaMin',this.value)"><div class="k">Em branco: 70% da soma das notas máximas (${Math.round(c.avals.reduce((a,v)=>a+v.max,0)*7)/10}). Frequência mínima: ${c.min}%.</div></div><div class="row"><button class="b2" onclick="window.__cd=null;render()">Descartar</button><button class="b" onclick="cdSave()" ${dirty?'':'disabled'}>Salvar alterações</button></div>
 <div class="c" style="margin-top:14px"><button class="b2 bad" onclick="delCurso('${c.id}')">Apagar curso</button></div>`};
function cdTotal(v){const c=cdGet(sel),n=parseInt(v);if(n>0)c.total=n;render()}
function cdRenMod(mi){const c=cdGet(sel),v=prompt('Nome do módulo',c.mods[mi].nome);if(v&&v.trim()){c.mods[mi].nome=v.trim();render()}}
function cdRenAula(mi,ai){const c=cdGet(sel),a=c.mods[mi].aulas[ai],v=prompt('Nome da aula',a.titulo);if(v&&v.trim()){a.titulo=v.trim();render()}}
function cdAdd(mi){const c=cdGet(sel);c.mods[mi].aulas.push({id:'a'+uid(),n:0,titulo:'Aula 0'});cdRenum(c);render()}
function cdDel(mi,ai){const c=cdGet(sel),a=c.mods[mi].aulas[ai];
 const hasAtt=andam.some(x=>{const t=tOf(x.id);return t&&t.cursoId===c.id&&x.att&&x.att[a.id]&&Object.keys(x.att[a.id]).length});
 if(hasAtt&&!confirm('A aula "'+a.titulo+'" já tem chamada registrada em alguma turma. Ao remover, essa chamada deixa de contar. Remover mesmo assim?'))return;
 c.mods[mi].aulas.splice(ai,1);cdRenum(c);render()}
function cdAvAdd(){const c=cdGet(sel),v=prompt('Nome da avaliação (ex.: Prova teórica)');if(v&&v.trim()){c.avals.push({id:'v'+uid(),nome:v.trim(),max:10});render()}}
function cdAvRen(i){const c=cdGet(sel),v=prompt('Nome da avaliação',c.avals[i].nome);if(v&&v.trim()){c.avals[i].nome=v.trim();render()}}
function cdAvMax(i,v){const c=cdGet(sel),n=parseFloat(String(v).replace(',','.'));if(n>0)c.avals[i].max=n;render()}
function cdAvDel(i){const c=cdGet(sel),v=c.avals[i];const has=andam.some(x=>{const t=tOf(x.id);return t&&t.cursoId===c.id&&Object.values(x.notas||{}).some(n=>n&&n[v.id]!=null)});
 if(has&&!confirm('A avaliação "'+v.nome+'" já tem notas lançadas em alguma turma. Ao remover, essas notas deixam de aparecer. Remover mesmo assim?'))return;c.avals.splice(i,1);render()}
async function cdSave(){const c=cdGet(sel);if(!c)return;const n=cdN(c),tot=c.total||n;
 if(n!==tot){alert('O curso precisa ter '+tot+' aulas para salvar. Hoje tem '+n+(n<tot?' (faltam '+(tot-n)+').':' (sobram '+(n-tot)+').'));return}
 c.total=tot;
 try{await db.collection('courses').doc(c.id).set(c);log('Curso alterado: '+c.nome);courses=courses.map(x=>x.id===c.id?clone(c):x);window.__cd=null;msg='Curso salvo.';render()}catch(e){alert(erroTxt(e))}}
async function delCurso(id){const c=courses.find(x=>x.id===id);if(!c)return;
 const tt=turmas.filter(t=>t.cursoId===id),at=tt.filter(t=>t.status==='ativa');
 if(at.length){alert('Este curso tem '+at.length+' turma(s) ativa(s): '+at.map(t=>t.id).join(', ')+'. Conclua ou cancele as turmas antes de apagar o curso.');return}
 const al=students.filter(s=>cidOf(s)===id&&s.status==='ativo').length;
 if(!confirm('Apagar o curso "'+c.nome+'"?'+(al?'\n\n'+al+' aluno(s) ativo(s) estão cadastrados nele e continuam no sistema.':'')+(tt.length?'\n\nTurmas concluídas ou canceladas deste curso perdem as informações do curso nos relatórios.':'')+'\n\nEsta ação não pode ser desfeita.'))return;
 try{await db.collection('courses').doc(id).delete();log('Curso apagado: '+c.nome);window.__cd=null;msg='Curso apagado.';go('cursos')}catch(e){alert(erroTxt(e))}}

/* ---------- Turmas ---------- */
function ntSnap(){const g=k=>($('#t_'+k)||{}).value;window.__nf={curso:g('curso'),per:g('per'),dia:g('dia'),turno:g('turno'),hora:g('hora'),max:g('max'),profs:[...document.querySelectorAll('.t_prof')].map(e=>e.value)};if(!window.__nf.profs.length)window.__nf.profs=['']}
function ntAddProf(){ntSnap();window.__nf.profs.push('');render()}
function ntRemProf(i){ntSnap();window.__nf.profs.splice(i,1);if(!window.__nf.profs.length)window.__nf.profs=[''];render()}
vTurmas=function(){const o=(l,f)=>l.map(f).join(''),m=manageT(),nf=window.__nf,me_=myProf();
 const head=(k,t)=>`<div class="row" onclick="window.${k}=!window.${k};render()" style="cursor:pointer"><b>${t}</b><span class="b2">${window[k]?'⌃':'⌄'}</span></div>`;
 const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`;
 const list=turmas.filter(t=>(t.status||'ativa')===window.__tf&&visT(t)).sort((a,b)=>(a.id.slice(-2)+a.id).localeCompare(b.id.slice(-2)+b.id));
 const aviso=perfil==='prof'&&!me_?'<div class="c bad">Seu login ainda não está vinculado a um professor. Peça ao diretor para vincular na tela Config.</div>':'';
 return`<h2>Turmas</h2>${aviso}${m?`<div class="c">${head('__ft','Nova turma')}${window.__ft?`<label>Curso</label><select id="t_curso">${o(courses.filter(c=>!c.arq),c=>opt(c.id,esc(c.nome),nf.curso))}</select><label>Professor(es)</label>${o(nf.profs,(pv,i)=>`<div class="row"><select class="t_prof" style="flex:1"><option value="">Selecione</option>${o(profs,p=>opt(p.id,esc(p.nome),pv))}</select>${nf.profs.length>1?`<button class="b2" onclick="ntRemProf(${i})">✕</button>`:''}</div>`)}<button class="b2" onclick="ntAddProf()">+ Adicionar professor</button><label>Período letivo</label><select id="t_per">${o([1,2,3,4],p=>opt(p,p,nf.per))}</select><label>Dia da semana</label><select id="t_dia">${o([1,2,3],d=>opt(d,DIAS[d],nf.dia))}</select><label>Turno</label><select id="t_turno">${o([1,2,3],n=>opt(n,TURNOS[n-1],nf.turno))}</select><label>Horário (24h, HH:MM)</label><input id="t_hora" placeholder="19:00" maxlength="5" value="${esc(nf.hora||'')}"><label>Quantidade máxima de alunos *</label><input id="t_max" type="number" min="1" value="${esc(nf.max||'')}"><div class="k">Código: [período][dia][turno]-[ano]. Ex.: 123-26</div><button class="b" onclick="createTurma()">Criar turma</button>`:''}</div>
 <div class="c">${head('__fp','Professores')}${window.__fp?`${o(profs,p=>`<div class="k">${esc(p.nome)}</div>`)}<input id="pr_n" placeholder="Nome do professor"><button class="b" onclick="addProf()">Adicionar professor</button>`:''}</div>`:''}
 <select onchange="window.__tf=this.value;render()" style="font-weight:700">${[['ativa','Turmas Ativas'],['concluida','Turmas Concluídas'],['cancelada','Turmas Canceladas']].map(([v,l])=>`<option value="${v}" ${window.__tf===v?'selected':''}>${l}</option>`).join('')}</select>
 ${o(list,t=>{const c=cOf(t),n=ocupadas(t),a=t.status==='ativa';return`<div class="c"><div class="row"><b>${t.id}</b><span class="tag">${t.status}</span></div><div class="k">${esc(c.nome)} · ${DIAS[t.dia]} · ${t.turno} ${t.hora} · prof. ${esc(profNames(t))} · período ${esc(String(t.periodo))}</div><div class="k">${n}${t.max?' de '+t.max:''} aluno(s) · avanço ${pct(lessonsT(c,t))}%</div><div class="row"><button class="b" onclick="go('turma','${t.id}')">Abrir turma</button>${m&&a?`<button class="b2" onclick="cancT('${t.id}')">Cancelar</button>`:''}</div>${m&&a?`<div class="row"><span class="k">Horário</span><input value="${t.hora}" maxlength="5" onchange="saveT('${t.id}','hora',this.value)"></div>`:''}</div>`})}${list.length?'':'<div class="c k">Nenhuma turma nesta situação.</div>'}`};
async function createTurma(){const g=k=>$('#t_'+k).value.trim(),d=+g('dia'),tn=+g('turno'),p=+g('per'),h=g('hora'),mx=parseInt(g('max'));
 const pids=[...document.querySelectorAll('.t_prof')].map(e=>e.value).filter(Boolean);
 if(!g('curso')||!pids.length||![1,2,3].includes(d)||![1,2,3].includes(tn)||![1,2,3,4].includes(p)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(h)||!(mx>0)){alert('Preencha curso, professor, período, dia, turno, horário (HH:MM) e a quantidade máxima de alunos.');return}
 if(new Set(pids).size!==pids.length){alert('O mesmo professor foi escolhido mais de uma vez.');return}
 const yy=String(new Date().getFullYear()).slice(-2),id=''+p+d+tn+'-'+yy;
 try{await db.collection('turmas').doc(id).create({id,cursoId:g('curso'),profId:pids[0],profIds:pids,periodo:p,dia:d,turno:TURNOS[tn-1],hora:h,ano:yy,max:mx,status:'ativa'});log('Turma criada: '+id);msg='Turma '+id+' criada.';window.__ft=false;window.__nf={profs:['']};render()}
 catch(e){if(/duplicate|23505|exist/i.test((e.message||'')+(e.code||'')))alert('Já existe uma turma com o código '+id+' (mesmo período, dia, turno e ano).');else alert(erroTxt(e))}}
async function saveTurmaF(id,fn){const t=clone(tOf(id));fn(t);try{await db.collection('turmas').doc(id).set(t)}catch(e){alert(erroTxt(e))}}
function addProfT(tid,pid){if(!pid)return;saveTurmaF(tid,t=>{const ids=profsOf(t).slice();if(ids.includes(pid))return;ids.push(pid);t.profIds=ids;t.profId=ids[0]})}
function remProfT(tid,pid){const t=tOf(tid);if(profsOf(t).length<=1){alert('A turma precisa ter pelo menos um professor.');return}saveTurmaF(tid,t=>{const ids=profsOf(t).filter(x=>x!==pid);t.profIds=ids;t.profId=ids[0]})}
function setMax(tid,v){const n=parseInt(v),t=tOf(tid);if(!(n>0)){alert('Informe um número maior que zero.');render();return}if(n<ocupadas(t)){alert('A turma já tem '+ocupadas(t)+' aluno(s) ativo(s). O máximo não pode ser menor.');render();return}saveTurmaF(tid,x=>{x.max=n})}
const sec=(k,t,body,extra)=>`<div class="row" onclick="window.__sec.${k}=!window.__sec.${k};render()" style="cursor:pointer"><h2>${t}${extra||''}</h2><span class="b2">${window.__sec[k]?'⌃':'⌄'}</span></div>${window.__sec[k]?body:''}`;
vTurma=function(){const t=tOf(sel);if(!t||!visT(t))return'<div class="c">Turma não encontrada.</div>';
 const c=cOf(t),ls=lessonsT(c,t),al=students.filter(s=>s.turmaId===t.id),act=t.status==='ativa',avs=c.avals||[],mg=manageT();
 const dd=c.docs||{};const alunos=al.map(s=>{const sx=s.status==='ativo'?statusAl(t,s):null;return`<div class="c"><div class="row"><b>${esc(s.nome)}</b><span class="tag">${esc(stEf(s))}${sx?' · '+sx.txt:''}</span></div>${atrasoRow(s)}${riscoTag(t,s)}${s.status==='ativo'&&(dd.bol||(dd.cert&&mg))?`<div class="row">${dd.bol?`<button class="b2" onclick="docBol('${t.id}',['${s.id}'])">Boletim</button>`:''}${dd.cert&&mg?`<button class="b2" onclick="docCert('${t.id}',['${s.id}'])">Certificado</button>`:''}</div>`:''}</div>`}).join('')||'<div class="c k">Nenhum aluno cadastrado nesta turma.</div>';
 const modulos=c.mods.map((m,mi)=>`<h2>${esc(m.nome)} <span class="k">${pct(ls.filter(a=>a.mi===mi))}%</span></h2>${ls.filter(a=>a.mi===mi).map(a=>{const op=window.__ob[a.id];return`<div class="c"><div class="row"><b>${a.n}. ${esc(a.titulo)}</b>${act?`<button class="b2" onclick="window.__les='${a.id}';go('chamada','${t.id}')">Chamada</button>`:''}</div>${act?`<div class="row"><input type="date" style="width:48%" value="${a.data}" onchange="saveLesT('${t.id}','${a.id}','data',this.value)"><select style="width:48%" onchange="saveLesT('${t.id}','${a.id}','status',this.value)">${['planejada','realizada','cancelada','reposta'].map(o=>`<option ${a.status===o?'selected':''}>${o}</option>`).join('')}</select></div>`:`<div class="k">${a.data?dbr(a.data)+' · ':''}${a.status}</div>`}
 <div class="row" onclick="window.__ob['${a.id}']=!window.__ob['${a.id}'];render()" style="cursor:pointer"><span class="k">Observação${a.obs?' ●':''}</span><span class="b2">${op?'⌃':'⌄'}</span></div>${op?(act?`<textarea id="ob_${a.id}" rows="3" onchange="saveObs('${t.id}','${a.id}',this.value)">${esc(a.obs)}</textarea><button class="b2" onclick="saveObs('${t.id}','${a.id}',document.getElementById('ob_${a.id}').value)">Salvar observação</button>`:`<div class="k">${esc(a.obs)||'Sem observação.'}</div>`):''}</div>`}).join('')}`).join('');
 const freq=al.filter(s=>s.status==='ativo').map(s=>{const f=freqT(c,t,s.id),low=f.pc!==null&&f.pc<c.min;return`<div class="c row"><span>${esc(s.nome)}<br><span class="k">${f.p} pres · ${f.f} faltas · ${f.j} justif.</span>${(()=>{const r=riscoFreq(t,s);return r&&r.nivel!=='ok'?'<br><span class="bad">⚠ '+faltaTxt(r)+'</span>':''})()}</span><b class="${low?'bad':'ok'}">${f.pc===null?'—':f.pc+'%'}</b></div>`}).join('')||'<div class="k">Nenhum aluno ativo.</div>';
 const aval=avs.length?al.filter(s=>s.status==='ativo').map(s=>{const md=acumT(t,s.id,avs);return`<div class="c"><div class="row"><b>${esc(s.nome)}</b><span class="k">Nota final ${md===null?'—':fmtN(md)}</span></div>${avs.map(v=>{const n=notaOf(t,s.id,v.id);return`<div class="row"><span class="k">${esc(v.nome)} (máx ${v.max})</span><input type="number" step="0.1" min="0" max="${v.max}" style="width:90px" value="${n===null?'':n}" ${act?'':'disabled'} onchange="saveNota('${t.id}','${s.id}','${v.id}',this.value)"></div>${v.rec?`<div class="row"><span class="k">↳ Recuperação</span><input type="number" step="0.1" min="0" max="${v.max}" style="width:90px" value="${notaOf(t,s.id,v.id+'__r')===null?'':notaOf(t,s.id,v.id+'__r')}" ${act?'':'disabled'} onchange="saveNota('${t.id}','${s.id}','${v.id}__r',this.value)"></div>`:''}`}).join('')}</div>`}).join('')||'<div class="k">Nenhum aluno ativo.</div>':'<div class="c k">Nenhuma avaliação cadastrada no curso. O diretor ou pedagógico cadastra na tela do curso.</div>';
 const pids=profsOf(t),n=ocupadas(t);
 return`<button class="b2" onclick="go('turmas')">← Voltar</button><div class="row"><h2>${t.id}</h2><span class="tag">${t.status}</span></div>
 <div class="c"><div class="k">${esc(c.nome)} · ${DIAS[t.dia]} · ${t.turno} ${t.hora} · período ${esc(String(t.periodo))}</div><div class="k">Professores: ${pids.map(id=>{const p=profs.find(x=>x.id===id)||{};return esc(p.nome||'—')+(mg&&act?` <a onclick="remProfT('${t.id}','${id}')">✕</a>`:'')}).join(', ')||'—'}</div>${mg&&act?`<select onchange="addProfT('${t.id}',this.value)"><option value="">+ Adicionar professor</option>${profs.filter(p=>!pids.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select><label>Máximo de alunos</label><input type="number" min="1" value="${t.max||''}" onchange="setMax('${t.id}',this.value)">`:''}
 <div class="k">${n}${t.max?' de '+t.max:''} aluno(s) ativo(s)</div><div class="v">${pct(ls)}% de avanço</div><div class="k">${ls.filter(done).length} de ${ls.filter(a=>a.status!=='cancelada').length} aulas realizadas</div>
 <div class="row">${can('rel')?`<button class="b2" onclick="window.__rel='freq';window.__rt='${t.id}';go('rel')">Relatório da turma</button>`:`<button class="b2" onclick="relTurmaDoc('${t.id}')">Relatório da turma</button>`}${act&&mg?`<button class="b" onclick="concT('${t.id}')">Concluir turma</button>`:''}</div>${(dd.bol||(dd.cert&&mg))?`<div class="row">${dd.bol?`<button class="b2" onclick="docBol('${t.id}')">Boletins da turma</button>`:''}${dd.cert&&mg?`<button class="b2" onclick="docCert('${t.id}')">Certificados</button>`:''}</div>`:''}</div>
 ${mg&&act?editSec(t):''}${sec('alunos','Alunos ('+al.length+')',alunos)}${sec('modulos','Módulos',modulos)}${sec('freq','Frequência',freq)}${sec('aval','Avaliações',aval)}${mg&&act?esperaSec(t):''}`};
async function concT(id){const t=clone(tOf(id)),f=lessonsT(cOf(t),t).filter(a=>a.status!=='cancelada'&&!done(a)).length;
 if(!confirm('Concluir a turma '+id+'?'+(f?'\n\nAinda há '+f+' aula(s) sem realizar.':'')+'\n\nEla sai das turmas ativas e fica guardada em "Turmas Concluídas".'))return;
 t.status='concluida';t.concluidaEm=today();
 try{await db.collection('turmas').doc(id).set(t);log('Turma concluída: '+id);msg='Turma '+id+' concluída.';go('turmas')}catch(e){alert(erroTxt(e))}}
vChamada=function(){const t=tOf(sel),c=t&&cOf(t),a=t&&visT(t)&&lessonsT(c,t).find(x=>x.id===window.__les);if(!a)return'';
 const r=(A(t).att||{})[a.id]||{},al=students.filter(s=>s.turmaId===t.id&&s.status==='ativo');
 return`<button class="b2" onclick="go('turma','${t.id}')">← Voltar</button><h2>Chamada: ${t.id}</h2><div class="k">${esc(c.nome)} · Aula ${a.n} · ${esc(a.titulo)} ${a.data?dbr(a.data):''}</div><button class="b2" onclick="todosP()">Todos presentes</button>${al.map(s=>`<div class="c"><b>${esc(s.nome)}</b><select id="a_${s.id}">${[['','—'],['P','Presente'],['F','Falta'],['J','Falta justificada'],['A','Atraso']].map(([v,l])=>`<option value="${v}" ${r[s.id]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')||'<div class="c k">Sem alunos ativos nesta turma.</div>'}<button class="b" onclick="saveCham()">Salvar chamada</button>`};

function freqRel(){const t=turmas.find(x=>x.id===window.__rt)||turmas[0];if(!t)return{t:'Frequência',h:['Aviso'],r:[['Cadastre uma turma primeiro.']]};
 const c=cOf(t),ls=lessonsT(c,t),avs=c.avals||[];
 return{t:'Frequência — turma '+t.id+' ('+c.nome+') · '+t.status+' · avanço '+pct(ls)+'%',h:['Aluno','Situação','Pres.','Faltas','Justif.','%','Frequência',...avs.map(v=>v.nome),'Média'],r:students.filter(s=>s.turmaId===t.id).map(s=>{const f=freqT(c,t,s.id),md=acumT(t,s.id,avs);return[s.nome,s.status,f.p,f.f,f.j,f.pc===null?'—':f.pc+'%',f.pc!==null&&f.pc<c.min?'ABAIXO':'ok',...avs.map(v=>{const n=notaOf(t,s.id,v.id);return n===null?'—':n}),md===null?'—':md]})}}

/* ---------- Config: vincular login ao professor ---------- */
function linkSel(u){const cur=profs.find(p=>p.userId===u.id);return`<label>Professor vinculado</label><select onchange="linkProf('${u.id}',this.value)"><option value="">— nenhum —</option>${profs.map(p=>`<option value="${p.id}" ${cur&&cur.id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>${cur?'':'<div class="k bad">Sem professor vinculado: ele não verá turmas.</div>'}`}
async function linkProf(uid,pid){try{for(const p of profs){if(p.userId===uid&&p.id!==pid){const q=clone(p);delete q.userId;await db.collection('professores').doc(q.id).set(q)}}
 if(pid){const q=clone(profs.find(x=>x.id===pid));q.userId=uid;await db.collection('professores').doc(pid).set(q)}log('Login vinculado ao professor')}catch(e){alert(erroTxt(e))}}

/* ---------- Caixa: painel detalhado ---------- */
const _vcx=vCaixa;
vCaixa=function(){const h=_vcx();const t=today(),pz=window.__cxp;
 const inP=d=>{if(d>t)return false;if(pz==='hoje')return d===t;if(pz==='semana')return d>=addD(t,-6);if(pz==='mes')return d.slice(0,7)===t.slice(0,7);return true};
 const ent=allIn().filter(x=>inP(x.data)),sai=expenses.filter(x=>!x.est&&inP(x.data));
 const grp=(l,kf,vf)=>{const m={};l.forEach(x=>{const k=kf(x);m[k]=m[k]||{v:0,n:0};m[k].v+=vf(x);m[k].n++});return Object.entries(m).sort((a,b)=>b[1].v-a[1].v)};
 const tot=l=>r2(l.reduce((a,x)=>a+x.valor,0));
 const rows=(g,T)=>g.map(([k,x])=>`<div class="row"><span>${esc(k)} <span class="k">(${x.n})</span></span><b>${brl(r2(x.v))} <span class="k">${T?Math.round(x.v/T*100):0}%</span></b></div>`).join('')||'<div class="k">Nada no período.</div>';
 const org=x=>x.desc.indexOf('(matrícula)')>=0?'Matrículas':x.desc.indexOf('Aluno:')===0?'Parcelas de alunos':'Contas a receber';
 const TE=tot(ent),TS=tot(sai);
 const allE=r2(allIn().filter(x=>x.data<=t).reduce((a,x)=>a+x.valor,0)),allS=r2(expenses.filter(x=>x.data<=t&&!x.est).reduce((a,x)=>a+x.valor,0));
 const body=`<select onchange="window.__cxp=this.value;render()">${[['hoje','Hoje'],['semana','Últimos 7 dias'],['mes','Este mês'],['tudo','Tudo']].map(([v,l])=>`<option value="${v}" ${pz===v?'selected':''}>${l}</option>`).join('')}</select>
 <div class="row"><span>Entradas</span><b class="ok">${brl(TE)}</b></div><div class="row"><span>Saídas</span><b class="bad">${brl(TS)}</b></div><div class="row"><span>Resultado</span><b>${brl(r2(TE-TS))}</b></div>
 <h2>Entradas por forma de pagamento</h2>${rows(grp(ent,x=>x.forma||'Não informada',x=>x.valor),TE)}
 <h2>Entradas por origem</h2>${rows(grp(ent,org,x=>x.valor),TE)}
 <h2>Saídas por categoria</h2>${rows(grp(sai,x=>x.cat||'Sem categoria',x=>x.valor),TS)}
 <h2>Conferência do saldo</h2><div class="row"><span>Saldo inicial</span><b>${brl(+cfg.saldoInicial||0)}</b></div><div class="row"><span>+ Entradas até hoje</span><b>${brl(allE)}</b></div><div class="row"><span>− Saídas até hoje</span><b>${brl(allS)}</b></div><div class="row"><span>= Saldo atual</span><b class="ac">${brl(saldoAtual())}</b></div>`;
 const panel=`<div class="c"><div class="row" onclick="window.__cx=!window.__cx;render()" style="cursor:pointer"><b>Detalhamento</b><span class="b2">${window.__cx?'⌃':'⌄'}</span></div>${window.__cx?body:''}</div>`;
 return h.replace(/(<h2>Fluxo de caixa<\/h2><div class="g">[\s\S]*?<\/div><\/div><\/div>)/,m=>m+panel)};

render=function(){_rdoc();let ps=document.getElementById('pagestyle');if(view==='docv'&&window.__doc){if(!ps){ps=document.createElement('style');ps.id='pagestyle';document.head.appendChild(ps)}ps.textContent='@page{size:A4 '+(window.__doc.land?'landscape':'portrait')+';margin:0}';docFit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(docFit)}else if(ps)ps.remove()};

function bolPage(t,s){const c=cOf(t),ls=lessonsT(c,t),avs=c.avals||[],at=A(t).att||{},st=statusAl(t,s),dg=dgNome();
 const N=ls.length||1,W1=658,wn=112.7,wf=65,cw=(W1-wn-wf)/N,navy='#07143d',teal='#084768',sh='#e8eef6',lt='#f7f9fc',bd='0.45pt solid #cdd6e4';
 const hc=(w,txt,bg,fs)=>'<th style="width:'+P(w)+';height:'+P(18)+';background:'+(bg||navy)+';color:#fff;font:700 '+P(fs||7.2)+' Arial,Helvetica,sans-serif;text-align:center;padding:0;border:'+bd+'">'+txt+'</th>';
 const dc=(txt,bg,extra)=>'<td style="height:'+P(18)+';background:'+(bg||lt)+';font:700 '+P(8)+' Arial,Helvetica,sans-serif;color:'+navy+';text-align:center;padding:0;border:'+bd+';'+(extra||'')+'">'+txt+'</td>';
 const tb=(top,w,rows)=>'<table style="position:absolute;left:'+P(42.5)+';top:'+P(top)+';width:'+P(w)+';border-collapse:collapse;table-layout:fixed">'+rows+'</table>';
 const h1=hc(wn,'ALUNO(A)')+ls.map((a,i)=>hc(cw,a.n,navy,N>24?6:7.2)).join('')+hc(wf,'FREQ. %');
 const r1=dc(esc(s.nome),lt,'font-weight:400;text-align:left;padding-left:'+P(4)+';overflow:hidden;white-space:nowrap')+ls.map((a,i)=>{const x=(at[a.id]||{})[s.id],v=!done(a)?'—':(x==='P'||x==='A')?'P':x==='F'?'F':x==='J'?'J':'—';return dc(v,i%2===0?sh:lt,v==='F'?'color:#c0281c':'')}).join('')+dc(st.pc2===null?'—':st.pc2.toFixed(2).replace('.',',')+'%',lt);
 const cols=[],hd=[],rw=[];avs.forEach((v,i)=>{cols.push(1);hd.push(hc(0,esc(v.nome).toUpperCase(),teal));rw.push(dc(fmtN(notaOf(t,s.id,v.id)),lt));if(v.rec){cols.push(1);hd.push(hc(0,'RECUP. '+(i+1),navy));const r=notaOf(t,s.id,v.id+'__r');rw.push(dc(r===null?'—':fmtN(r),lt))}});
 const wc=(673-wn-100)/Math.max(cols.length,1);

 const prn=profsDe(t).map(p=>esc(p.nome)).join(', ');

 return'<div class="pg pb"><img class="bg" src="'+IMG.bol+'">'
 +tx(53,183,205,11,fv,esc(s.nome),1)+tx(270,183,120,11,fv,esc(c.nome),1)+tx(405,183,48,11,fv,esc(String(t.id)),1)+tx(468,183,42,11,fv,'20'+esc(String(t.id).split('-')[1]||t.ano||''),1)+tx(525,183,206,11,fv,prn,1)
 +tb(247,W1,'<tr>'+h1+'</tr><tr>'+r1+'</tr>')+tb(315,673,'<tr>'+h2+'</tr><tr>'+r2+'</tr>')
 +tx(652,378,140,11,'font-family:Arial,Helvetica,sans-serif;font-weight:700;color:'+res[1],res[0])
 +tx(443,551,140,11,'font-family:Arial,Helvetica,sans-serif;color:#586078','Assinatura do diretor:')
 +'<div class="ab" style="left:'+P(583)+';top:'+P(551.2)+';width:'+P(207)+';height:'+P(0.9)+';background:#586078"></div>'
 +(dg?tx(583,548,207,17,"font-family:'Great Vibes',cursive;text-align:center;color:#0b1a44",esc(dg),1):'')+'</div>'}
function docBol(tid,sids){const t=tOf(tid);if(!t||!visT(t))return;const l=students.filter(s=>s.turmaId===tid&&s.status==='ativo'&&(!sids||sids.includes(s.id)));if(!l.length){alert('Nenhum aluno ativo nesta turma.');return}
 abrirDoc(l.map(s=>bolPage(t,s)).join(''),'Boletim — '+t.id,true,'turmas');log('Boletim gerado: turma '+t.id+(sids?' · '+l[0].nome:''))}
function docCert(tid,sids){const t=tOf(tid);if(!t||!manageT())return;let l=students.filter(s=>s.turmaId===tid&&s.status==='ativo'&&(!sids||sids.includes(s.id)));if(!l.length){alert('Nenhum aluno ativo nesta turma.');return}
 if(sids&&sids.length===1){const m=certMotivo(t,l[0]);if(m){alert(m);return}}
 else{const ok=[],bad=[];l.forEach(s=>{const m=certMotivo(t,s);m?bad.push(s.nome+': '+m):ok.push(s)});if(!ok.length){alert('Nenhum aluno pode receber certificado agora.\n\n'+bad.join('\n'));return}if(bad.length&&!confirm('Estes alunos não recebem certificado:\n\n'+bad.join('\n')+'\n\nGerar os outros '+ok.length+'?'))return;l=ok}
 if(!dgNome()&&!confirm('O nome do diretor ainda não foi preenchido em Config. Gerar o certificado sem a assinatura dele?'))return;
 abrirDoc(l.map(s=>certPage(t,s)).join(''),'Certificados — '+t.id,true,'turmas');log('Certificado emitido: turma '+t.id+' · '+l.map(s=>s.nome).join(', '))}
function relTurmaDoc(tid){const t=tOf(tid);if(!t||!visT(t))return;window.__rt=tid;const R=freqRel();
 abrirDoc('<div class="pg pr"><div style="padding:14mm"><h2 style="font-size:16px;margin:0 0 10px">'+esc(R.t)+'</h2><table class="rt"><tr>'+R.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+R.r.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table><p style="font-size:11px;margin-top:10px">Emitido em '+fmtD(today())+'</p></div></div>','Relatório — '+tid,false,'turmas',tid)}
freqRel=function(){const t=turmas.find(x=>x.id===window.__rt)||turmas[0];if(!t)return{t:'Frequência',h:['Aviso'],r:[['Cadastre uma turma primeiro.']]};
 const c=cOf(t),ls=lessonsT(c,t),avs=c.avals||[],h=['Aluno','Situação','Pres.','Faltas','Justif.','%','Frequência'];avs.forEach(v=>{h.push(v.nome);if(v.rec)h.push('Rec. '+v.nome)});if(avs.length)h.push('Nota final');h.push('Resultado');
 return{t:'Frequência — turma '+t.id+' ('+c.nome+') · '+t.status+' · avanço '+pct(ls)+'%',h,r:students.filter(s=>s.turmaId===t.id).map(s=>{const f=freqT(c,t,s.id),st=statusAl(t,s),row=[s.nome,stEf(s),f.p,f.f,f.j,f.pc===null?'—':f.pc+'%',f.pc!==null&&f.pc<c.min?'ABAIXO':'ok'];avs.forEach(v=>{row.push(fmtN(notaOf(t,s.id,v.id)));if(v.rec)row.push(notaOf(t,s.id,v.id+'__r')===null?'—':fmtN(notaOf(t,s.id,v.id+'__r')))});if(avs.length)row.push(fmtN(st.ac));row.push(st.txt);return row})}};

/* ---------- Editar turma ---------- */
function editSec(t){const dir=perfil==='dir',o=(l,f)=>l.map(f).join(''),opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`,dis=dir?'':'disabled';
 const tn=Math.max(1,TURNOS.indexOf(t.turno)+1);
 return sec('edit','Editar turma',`<div class="c"><label>Período letivo</label><select id="et_per" ${dis}>${o([1,2,3,4],p=>opt(p,p,t.periodo))}</select><label>Dia da semana</label><select id="et_dia" ${dis}>${o([1,2,3],d=>opt(d,DIAS[d],t.dia))}</select><label>Turno</label><select id="et_turno" ${dis}>${o([1,2,3],n=>opt(n,TURNOS[n-1],tn))}</select><label>Horário (24h, HH:MM)</label><input id="et_hora" maxlength="5" value="${esc(t.hora)}"><label>Quantidade máxima de alunos</label><input id="et_max" type="number" min="1" value="${t.max||''}">${dir?'<div class="k">Se mudar período, dia ou turno, o código da turma muda e os alunos e as chamadas acompanham.</div>':'<div class="k">Período, dia e turno só o diretor altera.</div>'}<button class="b" onclick="saveEditT('${t.id}')">Salvar alterações</button></div>`)}
async function saveEditT(tid){const t=tOf(tid);if(!t)return;const g=k=>$('#et_'+k).value.trim(),p=+g('per'),d=+g('dia'),tn=+g('turno'),h=g('hora'),mx=parseInt(g('max'));
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(h)||!(mx>0)||![1,2,3,4].includes(p)||![1,2,3].includes(d)||![1,2,3].includes(tn)){alert('Confira período, dia, turno, horário (HH:MM) e a quantidade máxima.');return}
 if(mx<ocupadas(t)){alert('A turma já tem '+ocupadas(t)+' aluno(s) ativo(s). O máximo não pode ser menor.');return}
 const yy=tid.split('-')[1],nid=''+p+d+tn+'-'+yy,base={...clone(t),periodo:p,dia:d,turno:TURNOS[tn-1],hora:h,max:mx};
 if(nid===tid){try{await db.collection('turmas').doc(tid).set(base);msg='Turma atualizada.';render()}catch(e){alert(erroTxt(e))}return}
 if(perfil!=='dir'){alert('Só o diretor altera período, dia ou turno, porque o código da turma muda e os alunos acompanham.');return}
 if(tOf(nid)){alert('Já existe uma turma com o código '+nid+'.');return}
 const al=students.filter(s=>s.turmaId===tid);
 if(!confirm('A turma '+tid+' vira '+nid+'. '+al.length+' aluno(s) e o andamento serão movidos. Continuar?'))return;
 try{base.id=nid;await db.collection('turmas').doc(nid).create(base);const an=andam.find(x=>x.id===tid);
  if(an){const a2=clone(an);a2.id=nid;await db.collection('andamento').doc(nid).set(a2)}
  for(const s of al){const s2=clone(s);s2.turmaId=nid;s2.turma=turmaLabel(base);await db.collection('students').doc(s.id).set(s2)}
  if(an)await db.collection('andamento').doc(tid).delete();await db.collection('turmas').doc(tid).delete();
  log('Turma '+tid+' alterada para '+nid);msg='Turma '+nid+' atualizada.';go('turma',nid)}catch(e){alert(erroTxt(e))}}

const FUNCAO={dir:'Diretor',fin:'Financeiro',ped:'Pedagógico',prof:'Professor'};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],SEMANA=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function nomeUser(){if(perfil==='prof'){const p=myProf();if(p&&p.nome)return p.nome}const u=(typeof users!=='undefined'&&users||[]).find(x=>x.id===me.id);return(u&&u.nome)||me.name||''}
const dataLonga=()=>{const d=new Date(today()+'T12:00:00');return SEMANA[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear()};
const saudacao=()=>{const n=nomeUser().trim().split(/\s+/)[0],fn=perfil==='dir'&&cfg.dgId&&cfg.dgId===me.id?'Diretor Geral':(FUNCAO[perfil]||'');return`<div class="c"><b>Olá ${fn}${n?' '+esc(n):''}</b><div class="k">${dataLonga()}</div></div>`};
const turmasAtivas=()=>turmas.filter(t=>t.status==='ativa'&&visT(t));
const faltaTxt=r=>r.nivel==='perdeu'?'abaixo da frequência mínima':(r.rest===0?'não pode faltar mais':'pode faltar só mais '+r.rest);
function riscoFreq(t,s){if(s.status!=='ativo')return null;const c=cOf(t),N=lessonsT(c,t).filter(a=>a.status!=='cancelada').length;if(!N)return null;const f=freqT(c,t,s.id),faltas=f.f+(c.just?f.j:0),allowed=Math.floor(N*(1-c.min/100)+1e-9),rest=allowed-faltas;return{rest,allowed,faltas,N,nivel:rest<0?'perdeu':rest<=2?'risco':'ok'}}
const riscoTag=(t,s)=>{const r=riscoFreq(t,s);if(!r||r.nivel==='ok')return'';return`<div class="bad"><b>⚠ ${r.nivel==='perdeu'?'Abaixo do mínimo':'Frequência em risco'}</b> · ${r.faltas} falta(s) · ${faltaTxt(r)}</div>`};
const atrasoRow=s=>{if(perfil!=='dir'&&perfil!=='fin')return'';const a=atraso(s);return a?`<div class="bad"><b>⚠ Atrasado</b> · ${brl(a.v)} · ${a.q} parcela(s) · há ${a.dias} dia(s)</div><button class="b2" onclick="event.stopPropagation();cobrarWpp('${s.id}')">Cobrar no WhatsApp</button>`:''};
function foneWpp(tel){let d=String(tel||'').replace(/\D/g,'');if(!d)return'';if(d.length<=11)d='55'+d;return d}
function abrirWpp(tel,txt){const f=foneWpp(tel);if(!f){alert('Sem telefone cadastrado.');return false}window.open('https://wa.me/'+f+'?text='+encodeURIComponent(txt),'_blank');return true}
function cobrarWpp(sid){const s=students.find(x=>x.id===sid);if(!s)return;const a=atraso(s);if(!a){alert('Este aluno não tem parcela em atraso.');return}
 const venc=(s.inst||[]).filter(i=>r2(i.valor-paidOf(s,i.n))>0.005&&i.due<today()).map(i=>i.due).sort()[0];
 if(abrirWpp(s.tel,'Olá, '+s.nome.trim().split(/\s+/)[0]+'! Tudo bem? Aqui é da Escola de Barbearia Irmãos Du Corte. Identificamos '+a.q+' parcela(s) em aberto, no total de '+brl(a.v)+' (a mais antiga venceu em '+fmtD(venc)+'). Podemos ajudar a regularizar? Obrigado!'))log('Cobrança aberta no WhatsApp: '+s.nome)}
function todosP(){document.querySelectorAll('[id^="a_"]').forEach(e=>{e.value='P'})}

/* ---------- Painel do professor ---------- */
function vPainelProf(){const p=myProf();if(!p)return saudacao()+'<div class="c bad">Seu login ainda não está vinculado a um professor. Peça ao diretor para vincular na tela Config.</div>';
 const mine=turmasAtivas(),dow=new Date(today()+'T12:00:00').getDay(),hoje=mine.filter(t=>t.dia===dow);
 const prox=t=>lessonsT(cOf(t),t).find(a=>a.status==='planejada');
 const pend=[],risco=[];
 mine.forEach(t=>{const c=cOf(t),ls=lessonsT(c,t),al=students.filter(s=>s.turmaId===t.id&&s.status==='ativo'),avs=c.avals||[];
  const at=ls.filter(a=>a.status==='planejada'&&a.data&&a.data<today()).length,sd=ls.filter(a=>a.status==='planejada'&&!a.data).length;
  let sn=0;al.forEach(s=>avs.forEach(v=>{if(efet(t,s.id,v)===null)sn++}));
  if(at)pend.push(t.id+': '+at+' aula(s) com data passada sem chamada');if(sd)pend.push(t.id+': '+sd+' aula(s) sem data');if(sn)pend.push(t.id+': '+sn+' nota(s) por lançar');
  al.forEach(s=>{const r=riscoFreq(t,s);if(r&&r.nivel!=='ok')risco.push(s.nome+' ('+t.id+'): '+faltaTxt(r))})});
 const li=a=>a.length?a.map(x=>`<div class="k">• ${esc(x)}</div>`).join(''):'<div class="k">Nada pendente.</div>';
 return saudacao()+`<h2>Hoje</h2>${hoje.map(t=>{const a=prox(t),c=cOf(t);return`<div class="c"><div class="row"><b>${t.id}</b><span class="k">${t.turno} ${t.hora}</span></div><div class="k">${esc(c.nome)}</div>${a?`<div class="k">Próxima aula: ${a.n}. ${esc(a.titulo)}</div><button class="b" onclick="window.__les='${a.id}';go('chamada','${t.id}')">Fazer chamada</button>`:'<div class="k">Todas as aulas já foram registradas.</div>'}</div>`}).join('')||'<div class="c k">Você não tem aula hoje.</div>'}
 <h2>Pendências</h2><div class="c">${li(pend)}</div><h2>Alunos em risco de frequência</h2><div class="c">${li(risco)}</div>
 <h2>Minhas turmas</h2>${mine.map(t=>{const c=cOf(t),al=students.filter(s=>s.turmaId===t.id&&s.status==='ativo'),fs=al.map(s=>freqT(c,t,s.id).pc).filter(x=>x!==null),fm=fs.length?Math.round(fs.reduce((a,b)=>a+b,0)/fs.length):null,d=c.docs||{};return`<div class="c"><div class="row"><b>${t.id}</b><span class="k">${DIAS[t.dia]} · ${t.turno} ${t.hora}</span></div><div class="k">${esc(c.nome)} · avanço ${pct(lessonsT(c,t))}% · ${al.length}${t.max?' de '+t.max:''} aluno(s) · frequência média ${fm===null?'—':fm+'%'}</div><div class="row"><button class="b" onclick="go('turma','${t.id}')">Abrir turma</button><button class="b2" onclick="relTurmaDoc('${t.id}')">Relatório</button>${d.bol?`<button class="b2" onclick="docBol('${t.id}')">Boletins</button>`:''}</div></div>`}).join('')||'<div class="c k">Nenhuma turma ativa para você.</div>'}`}

/* ---------- Resumo da semana (diretor, pedagógico, financeiro) ---------- */
window.__rs=false;
function resumoSemana(){const m=perfil==='dir'||perfil==='ped',f=perfil==='dir'||perfil==='fin';let n=0;const sec_=[];
 const blk=(t,arr)=>{if(!arr.length)return;n+=arr.length;sec_.push(`<div class="k"><b>${t}</b></div>`+arr.join(''))};
 const li=x=>`<div class="k">• ${esc(x)}</div>`;
 if(m){const at=turmasAtivas(),ar=[],qc=[],es=[],rk=[];
  at.forEach(t=>{const c=cOf(t),k=lessonsT(c,t).filter(a=>a.status==='planejada'&&a.data&&a.data<today()).length;if(k)ar.push(li(t.id+': '+k+' aula(s) com data passada sem chamada'));
   const o=ocupadas(t);if(t.max&&o/t.max>=0.8)qc.push(li(t.id+': '+o+' de '+t.max+(o>=t.max?' (cheia)':'')));
   if((t.espera||[]).length&&(!t.max||o<t.max))es.push(li(t.id+': '+t.espera.length+' na lista de espera e '+(t.max?(t.max-o)+' vaga(s) aberta(s)':'vaga aberta')));
   students.filter(s=>s.turmaId===t.id).forEach(s=>{const r=riscoFreq(t,s);if(r&&r.nivel!=='ok')rk.push(li(s.nome+' ('+t.id+'): '+faltaTxt(r)))})});
  blk('Aulas atrasadas',ar);blk('Turmas quase cheias',qc);blk('Vaga aberta com lista de espera',es);blk('Alunos em risco de frequência',rk)}
 if(f){const ls=students.map(s=>({s,a:atraso(s)})).filter(x=>x.a).sort((x,y)=>y.a.dias-x.a.dias);
  blk('Pagamentos atrasados',ls.slice(0,10).map(x=>`<div class="row"><span class="k">• ${esc(x.s.nome)} · ${brl(x.a.v)} · ${x.a.dias} dia(s)</span><button class="b2" onclick="cobrarWpp('${x.s.id}')">WhatsApp</button></div>`));
  if(ls.length>10)sec_.push(`<div class="k">+ ${ls.length-10} aluno(s) em atraso. Veja na aba Alunos.</div>`)}
 return`<div class="c"><div class="row" onclick="window.__rs=!window.__rs;render()" style="cursor:pointer"><b>Resumo da semana${n?' ('+n+')':''}</b><span class="b2">${window.__rs?'⌃':'⌄'}</span></div>${window.__rs?(sec_.join('')||'<div class="k">Tudo em ordem por enquanto.</div>'):''}</div>`}
const _vp0=vPainel;
vPainel=function(){if(perfil==='prof')return vPainelProf();if(perfil==='ped')return'<h2>Painel</h2>'+saudacao()+resumoSemana();return saudacao()+_vp0()+resumoSemana()};

/* ---------- Lista de espera ---------- */
function esperaSec(t){const e=t.espera||[],o=ocupadas(t),vaga=!t.max||o<t.max;
 const body=e.map(x=>`<div class="c"><div class="row"><b>${esc(x.nome)}</b><span class="k">${fmtD(x.data)}</span></div><div class="k">${esc(x.tel||'sem telefone')}</div><div class="row">${vaga&&x.tel?`<button class="b2" onclick="avisarEspera('${t.id}','${x.id}')">Avisar da vaga</button>`:''}<button class="b2" onclick="remEspera('${t.id}','${x.id}')">Remover</button></div></div>`).join('')||'<div class="k">Ninguém na espera.</div>';
 return sec('espera','Lista de espera ('+e.length+')',(vaga&&e.length?'<div class="c ok">Há vaga aberta nesta turma.</div>':'')+body+`<div class="c"><input id="we_n" placeholder="Nome"><input id="we_t" type="tel" placeholder="Telefone/WhatsApp"><button class="b" onclick="addEspera('${t.id}')">Adicionar à espera</button></div>`)}
function addEspera(tid){const n=($('#we_n').value||'').trim(),tl=($('#we_t').value||'').trim();if(!n){alert('Informe o nome.');return}saveTurmaF(tid,x=>{x.espera=(x.espera||[]).concat([{id:uid(),nome:n,tel:tl,data:today()}])});log('Lista de espera: '+n+' · turma '+tid)}
function remEspera(tid,id){saveTurmaF(tid,x=>{x.espera=(x.espera||[]).filter(e=>e.id!==id)})}
function avisarEspera(tid,id){const t=tOf(tid),e=(t.espera||[]).find(x=>x.id===id);if(!e)return;const c=cOf(t);
 abrirWpp(e.tel,'Olá, '+e.nome.trim().split(/\s+/)[0]+'! Abriu uma vaga na turma '+t.id+' ('+c.nome+', '+DIAS[t.dia]+', '+t.turno+' '+t.hora+') da Escola de Barbearia Irmãos Du Corte. Você ainda tem interesse? Responda para garantirmos sua vaga.')}

/* ---------- Recibo ---------- */
function extenso(v){const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'],d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
 const n3=n=>{if(n===100)return'cem';const r=[],ce=Math.floor(n/100),re=n%100;if(ce)r.push(c[ce]);if(re){if(re<20)r.push(u[re]);else{const di=Math.floor(re/10),un=re%10;r.push(d[di]+(un?' e '+u[un]:''))}}return r.join(' e ')};
 const tot=Math.round(v*100),int=Math.floor(tot/100),cent=tot%100,mi=Math.floor(int/1000),re=int%1000,p=[];
 if(mi)p.push(mi===1?'mil':n3(mi)+' mil');if(re)p.push(n3(re));
 const R=p.length?p.join(re&&(re<100||re%100===0)?' e ':' '):'';
 const a=int?R+(int===1?' real':' reais'):'',b=cent?n3(cent)+(cent===1?' centavo':' centavos'):'';
 return a&&b?a+' e '+b:(a||b||'zero real')}
function recibo(sid,pid){const s=students.find(x=>x.id===sid),p=s&&(s.pays||[]).find(x=>x.id===pid);if(!p)return;
 const dir=cfg.diretor?cfg.diretor+(cfg.cargo?' — '+cfg.cargo:''):'',ref=p.inst?'parcela '+p.inst:'matrícula',num=String(p.id).slice(-6).toUpperCase();
 abrirDoc('<div class="pg pr"><div style="padding:16mm 18mm;font-family:Arial,sans-serif;color:#111"><div style="display:flex;align-items:center;gap:6mm;border-bottom:2px solid #111;padding-bottom:5mm"><img src="'+IMG.logo+'" style="height:30mm"><div><div style="font-size:18px;font-weight:700">Escola de Barbearia Irmãos Du Corte</div><div style="font-size:12px;margin-top:2mm">Rua Gregório Santana, 713 - Piabetá - Magé - RJ | CEP: 25932-570<br>CNPJ: 23.845.892/0001-27 | escoladebarbeariaidc@gmail.com</div></div></div>'
 +'<h1 style="text-align:center;letter-spacing:.2em;margin:10mm 0 2mm">RECIBO</h1><div style="text-align:center;font-size:13px;margin-bottom:10mm">Nº '+num+' · '+fmtD(p.data)+'</div>'
 +'<div style="font-size:20px;font-weight:700;border:2px solid #111;padding:4mm;text-align:center;margin-bottom:8mm">'+brl(p.valor)+'</div>'
 +'<p style="font-size:15px;line-height:1.7;text-align:justify">Recebemos de <b>'+esc(s.nome)+'</b>'+(s.cpf?', CPF '+esc(s.cpf):'')+', a importância de <b>'+brl(p.valor)+'</b> ('+extenso(p.valor)+'), referente a <b>'+ref+'</b> do curso <b>'+esc(s.curso)+'</b>'+(p.forma?', pago em <b>'+esc(p.forma)+'</b>':'')+', em '+fmtD(p.data)+'. Damos plena e geral quitação.</p>'
 +'<p style="font-size:13px;margin-top:6mm">Saldo restante do aluno: <b>'+brl(saldoDev(s))+'</b></p>'
 +'<div style="margin-top:40mm;text-align:center"><div style="width:90mm;border-top:1.5px solid #111;margin:0 auto;padding-top:2mm;font-size:13px">'+esc(dir||'Responsável')+'</div></div><div style="text-align:center;font-size:11px;margin-top:20mm;color:#555">Emitido em '+fmtD(today())+'</div></div></div>','Recibo '+num,false,'alunos');
 log('Recibo emitido: '+s.nome+' · '+brl(p.valor))}
